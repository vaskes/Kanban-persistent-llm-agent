<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kanban-agent — вход</title>
<style>
 body{font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#111214;color:#e8e8ea;
      margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
 .card{width:100%;max-width:380px;background:#1a1b1e;border:1px solid #2b2d33;border-radius:10px;padding:28px}
 h1{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:.2px}
 .sub{color:#8b8d94;font-size:13px;margin:0 0 22px}
 label{display:block;font-size:13px;color:#b9bbc2;margin:14px 0 6px}
 input[type=text],input[type=password]{width:100%;box-sizing:border-box;padding:10px 12px;font-size:15px;
      background:#101114;border:1px solid #34363d;border-radius:6px;color:#e8e8ea;outline:none}
 input:focus{border-color:#3f7fd0;box-shadow:0 0 0 2px rgba(63,127,208,.22)}
 button{width:100%;margin-top:22px;padding:11px;font-size:15px;font-weight:500;cursor:pointer;
        background:#3f7fd0;border:0;border-radius:6px;color:#fff}
 button:hover{background:#4a8ade}
 .err{background:#3a1d1f;border:1px solid #6b3034;color:#f3b0b3;padding:10px 12px;
      border-radius:6px;margin-bottom:16px;font-size:14px}
 .next{color:#7c8899;font-size:12px;margin-top:18px;line-height:1.5}
 a{color:#6ba3e8}
</style></head><body>
<div class="card">
  <h1>kanban-agent</h1>
  <p class="sub">доска задач персистентного агента</p>
  {% if form.errors %}
    <div class="err">Неверный логин или пароль.</div>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    {{ form.username }}
    <label for="id_username">Логин</label>
    <input type="text" name="username" id="id_username" autofocus autocomplete="username" required>
    <label for="id_password">Пароль</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password" required>
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <button type="submit">Войти</button>
  </form>
  <p class="next">
    Регистрации нет — учётные записи создаёт оператор на хосте.
    Сессия живёт 14 дней, повторно входить не нужно.
  </p>
</div>
</body></html>

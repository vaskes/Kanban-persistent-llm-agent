<!doctype html><html><head><meta charset="utf-8"><title>reports</title>
<style>body{font:14px system-ui;background:#111;color:#eee;padding:20px}
table{border-collapse:collapse}td,th{padding:6px 14px;border:1px solid #333}
a{color:#7cc4ff}</style></head><body>
<p><a href="/">← board</a></p><h1>reports</h1>
<h3>by status</h3><table><tr><th>status</th><th>n</th></tr>
{% for r in by_status %}<tr><td>{{ r.status }}</td><td>{{ r.n }}</td></tr>{% endfor %}</table>
<h3>events by actor</h3><table><tr><th>actor</th><th>n</th></tr>
{% for r in by_actor %}<tr><td>{{ r.actor }}</td><td>{{ r.n }}</td></tr>{% endfor %}</table>
<h3>tokens</h3><p>{{ total_tokens }}</p>
</body></html>
